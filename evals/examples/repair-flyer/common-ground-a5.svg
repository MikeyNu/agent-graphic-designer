<title id="art-title">Common Ground repair day</title>
<desc id="art-description">COMMON GROUND. Repair together. A neighbourhood repair day. Saturday 14 November 2026, 09:00 to 13:00, Civic Hall. Free entry. Bring one small item. Tools provided. Everyone welcome.</desc>
